    - heading "Show the value. Ask only what helps." [level=2] [ref=f2e409]
    - paragraph [ref=f2e410]: A single promise replaces the four-page introduction. Two relevant choices shape the first session. A local input preview sets expectations before authentication. Invitations remain a separate access gate.
