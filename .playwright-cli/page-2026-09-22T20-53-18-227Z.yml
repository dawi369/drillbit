        - generic [ref=f2e415]: No carousel
      - article [ref=f2e416]:
        - text: "02"
        - heading "Goal and level" [level=3] [ref=f2e417]
        - paragraph [ref=f2e418]: Choose the practice goal and current level. Use sensible defaults; both remain editable.
        - generic [ref=f2e419]: Two relevant choices
      - article [ref=f2e420]:
        - text: "03"
        - heading "Try the input" [level=3] [ref=f2e421]
        - paragraph [ref=f2e422]: Type or use keyboard dictation. A local preview is clearly labelled and never graded.
        - generic [ref=f2e423]: No inference call
      - article [ref=f2e424]:
