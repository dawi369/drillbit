name: Drillbit
options:
  bundleIdPrefix: dawi
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '2.0.0'
    CURRENT_PROJECT_VERSION: '11'
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    revision: 02f98f89a19b6c079517c9aae07df7edd0e600e5
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS.git
    from: 4.17.0
targets:
  Drillbit:
    type: application
    platform: iOS
    sources: [Drillbit, Shared]
    configFiles:
      Debug: Config/Defaults.xcconfig
      Release: Config/Defaults.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dawi.drillbit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: Config/AppInfo.plist
      properties:
        CFBundleDisplayName: Drillbit
        NSCameraUsageDescription: Drillbit’s voice library includes camera support. Drillbit uses audio only and does not request camera access.
        NSMicrophoneUsageDescription: Talk with your practice interviewer using live voice.
        APIBaseURL: $(API_BASE_URL)
        ClerkPublishableKey: $(CLERK_PUBLISHABLE_KEY)
        SuperwallAPIKey: $(SUPERWALL_API_KEY)
        PrivacyPolicyURL: $(PRIVACY_POLICY_URL)
        SharedKeychainGroup: $(AppIdentifierPrefix)dawi.drillbit.shared
        CFBundleURLTypes:
          - CFBundleURLSchemes: [drillbit, dawi.drillbit]
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dawi.drillbit.refresh]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Literata.ttf]
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [group.dawi.drillbit]
        com.apple.developer.applesignin: [Default]
        keychain-access-groups: [$(AppIdentifierPrefix)dawi.drillbit, $(AppIdentifierPrefix)dawi.drillbit.shared]
    preBuildScripts:
      - name: Require privacy policy for Release
        basedOnDependencyAnalysis: false
        script: |
          # App Review rejects subscription apps without a privacy policy link in the paywall and Settings.
          if [ "$CONFIGURATION" = "Release" ] && [ "${PRIVACY_POLICY_URL#https://}" = "$PRIVACY_POLICY_URL" ]; then
            echo "error: Set PRIVACY_POLICY_URL (https:/\$()/host/privacy) in Config/Local.xcconfig before archiving."
            exit 1
          fi
    dependencies:
      - package: WebRTC
      - package: Clerk
        product: ClerkKit
      - package: SuperwallKit
      - target: DrillbitWidget
  DrillbitWidget:
    type: app-extension
    platform: iOS
    sources: [DrillbitWidget, Shared]
    configFiles:
      Debug: Config/Defaults.xcconfig
      Release: Config/Defaults.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dawi.drillbit.widget
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Drillbit
        SharedKeychainGroup: $(AppIdentifierPrefix)dawi.drillbit.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.dawi.drillbit]
        keychain-access-groups: [$(AppIdentifierPrefix)dawi.drillbit.shared]
  DrillbitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Drillbit
  DrillbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      # The local products, so a UI test can open a StoreKit test session and see the real paywall options.
      - path: Config/Drillbit.storekit
        buildPhase: resources
    settings:
      base:
        DEVELOPMENT_TEAM: 7M4NDAAP73
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Drillbit
schemes:
  Drillbit:
    build:
      targets:
        Drillbit: all
    run:
      storeKitConfiguration: Config/Drillbit.storekit
    test:
      targets: [DrillbitTests, DrillbitUITests]
